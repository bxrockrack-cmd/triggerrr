name: Build plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, cmake_args: "" }
          - { name: macOS,   os: macos-latest,   cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" }
          - { name: Linux,   os: ubuntu-latest,  cmake_args: "" }

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "${{ matrix.cmake_args }}"
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SnareTrigger-${{ matrix.name }}-VST3
          path: build/SnareTrigger_artefacts/Release/VST3
          if-no-files-found: error

      - name: Upload AU (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SnareTrigger-macOS-AU
          path: build/SnareTrigger_artefacts/Release/AU
          if-no-files-found: error
